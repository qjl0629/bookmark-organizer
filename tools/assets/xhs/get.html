<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>get</title>
  <link rel="stylesheet" href="common.css">
  <style>
    h2 { font-size: 92px; }
    .steps { display: grid; gap: 28px; margin-top: 50px; }
    .step { padding: 36px 40px; display: flex; gap: 32px; align-items: center; }
    .num { flex: none; width: 92px; height: 92px; border-radius: 28px; display: grid; place-items: center; font-size: 50px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #4f46e5, #8b3df0); }
    .step h3 { font-size: 44px; font-weight: 760; }
    .step p { font-size: 31px; line-height: 1.5; color: #55557a; margin-top: 6px; }
    code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; background: #efeefc; padding: 2px 10px; border-radius: 10px; color: #3730a3; }
    .star { margin-top: 36px; padding: 34px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 38px; font-weight: 700; }
    .star small { display: block; font-size: 28px; font-weight: 500; color: #5a5a7e; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="brand"><img src="../../../extension/icons/icon-128.png" alt="">Marksly<small>书签整理师</small></div>
  <h2>怎么<em>用上</em>？</h2>
  <div class="steps">
    <div class="card step"><div class="num">1</div><div><h3>去 GitHub 下载</h3><p>搜 <code>qjl0629/bookmark-organizer</code><br>点 Code → Download ZIP，解压</p></div></div>
    <div class="card step"><div class="num">2</div><div><h3>加载到 Chrome</h3><p>地址栏输入 <code>chrome://extensions</code><br>打开右上角“开发者模式” → 加载已解压的扩展程序<br>选择解压出来的 <code>extension</code> 文件夹</p></div></div>
    <div class="card step"><div class="num">3</div><div><h3>点工具栏的图标</h3><p>先看它打算怎么整理，<br>满意了再点“Tidy up”</p></div></div>
  </div>
  <div class="card star"><div>觉得有用，点个 ⭐ 就是最大的鼓励<small>目前还没上架应用商店，所以需要手动安装</small></div></div>
  <div class="footer"><span>Marksly · 开源 MIT</span><span>欢迎在 Issues 里提建议</span></div>
</body>
</html>
