<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>pain</title>
  <link rel="stylesheet" href="common.css">
  <style>
    h1 { font-size: 100px; }
    .list { display: grid; gap: 34px; margin-top: 56px; }
    .item { padding: 44px 48px; display: flex; gap: 38px; align-items: center; }
    .num { flex: none; width: 112px; height: 112px; border-radius: 32px; display: grid; place-items: center; font-size: 60px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #4f46e5, #8b3df0); }
    .item h3 { font-size: 54px; font-weight: 780; }
    .item p { font-size: 36px; line-height: 1.5; color: #55557a; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="brand"><img src="../../../extension/icons/icon-128.png" alt="">Marksly<small>书签整理师</small></div>
  <h1>收藏夹，是收藏<br>还是<em>吃灰</em>？</h1>
  <div class="list">
    <div class="card item"><div class="num">1</div><div><h3>越存越多</h3><p>存的时候顺手一点，<br>从来没有时间整理</p></div></div>
    <div class="card item"><div class="num">2</div><div><h3>放错文件夹</h3><p>匆忙之间丢进了不对的分类，<br>自己都忘了</p></div></div>
    <div class="card item"><div class="num">3</div><div><h3>要用的时候找不到</h3><p>只记得是“上个月存的”，<br>翻了三个文件夹还没找到</p></div></div>
  </div>
  <div class="footer"><span>所以我做了 Marksly</span><span>下一张 →</span></div>
</body>
</html>
