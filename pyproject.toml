[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-organizer"
version = "0.1.0"
description = "Analyze a Chrome bookmarks file and propose a cleaner folder structure"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
bookmark-organizer = "bookmark_organizer.cli:main"

[tool.setuptools]
packages = ["bookmark_organizer"]
