<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>promo tile</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body {
      font-family: -apple-system, "Helvetica Neue", sans-serif; color: #14142b; padding: 34px 32px;
      background: radial-gradient(300px 220px at 105% -10%, #dcd2ff 0%, transparent 60%), radial-gradient(260px 220px at -5% 110%, #d3e4ff 0%, transparent 60%), #f6f5ff;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 750; }
    .brand img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 6px 16px rgba(79,70,229,.35); }
    h1 { font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; margin-top: 26px; }
    h1 em { font-style: normal; background: linear-gradient(90deg, #4f46e5, #8b3df0); -webkit-background-clip: text; color: transparent; }
    p { font-size: 16px; color: #4a4a68; margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="brand"><img src="../../extension/icons/icon-128.png" alt="">Marksly</div>
  <h1>Bookmarks that<br><em>tidy themselves.</em></h1>
  <p>Preview every move. Undo anytime.<br>100% on your device.</p>
</body>
</html>
