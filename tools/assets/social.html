<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>social preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1280px; height: 640px; overflow: hidden; }
    body {
      font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif; color: #14142b; position: relative;
      background: radial-gradient(700px 500px at 105% -10%, #dcd2ff 0%, transparent 60%), radial-gradient(600px 500px at -5% 110%, #d3e4ff 0%, transparent 60%), #f6f5ff;
    }
    .left { position: absolute; left: 84px; top: 78px; width: 560px; }
    .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 750; }
    .brand img { width: 62px; height: 62px; border-radius: 17px; box-shadow: 0 10px 26px rgba(79,70,229,.35); }
    h1 { font-size: 68px; line-height: 1.08; font-weight: 800; letter-spacing: -0.025em; margin-top: 40px; }
    h1 em { font-style: normal; background: linear-gradient(90deg, #4f46e5, #8b3df0); -webkit-background-clip: text; color: transparent; }
    p { font-size: 28px; line-height: 1.45; color: #4a4a68; margin-top: 24px; }
    .tags { display: flex; gap: 12px; margin-top: 34px; }
    .tag { padding: 10px 20px; border-radius: 999px; font-size: 22px; font-weight: 650; background: #ecebff; color: #4338ca; }
    .tag.g { background: #e2f6ea; color: #17703a; }
    .shot { position: absolute; left: 700px; top: 70px; width: 640px; height: 500px; overflow: hidden; border-radius: 26px 0 0 26px;
      border: 2px solid #e6e4fb; box-shadow: 0 24px 60px rgba(79,70,229,.2); background: #fff; }
    .shot img { position: absolute; left: -150px; top: -22px; width: 1280px; }
  </style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="../../extension/icons/icon-128.png" alt="">Marksly</div>
    <h1>Bookmarks that<br><em>tidy themselves.</em></h1>
    <p>See every move first. Undo in one click.<br>Runs on your device, no upload.</p>
    <div class="tags"><span class="tag">Chrome extension</span><span class="tag g">Local &amp; private</span></div>
  </div>
  <div class="shot"><img src="../../docs/shot-2-misfiled.png" alt=""></div>
</body>
</html>
